name: debt_reminder
description: TR Ledger — a local-only debt and bill reminder app for TR Clothings.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  sqlite3: ^3.5.2
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^4.1.1
  go_router: ^14.6.2
  intl: ^0.19.0
  uuid: ^4.5.1
  clock: ^1.1.1
  rxdart: ^0.28.0
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.20.3
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/fonts/

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
